<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scratch Portfolio Bedroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='7' height='7' rx='2' fill='%23ff5a3c'/%3E%3Crect x='9' width='7' height='7' rx='2' fill='%23ffc531'/%3E%3Crect y='9' width='7' height='7' rx='2' fill='%2312bfa0'/%3E%3Crect x='9' y='9' width='7' height='7' rx='2' fill='%233aa0ff'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/three.module.js",
  "three/addons/": "/vendor/three/addons/"
} }
</script>
</head>
<body>
<canvas id="gl" aria-label="A 3D room showing this Scratcher's projects. Use the project list button for a text version."></canvas>

<main id="landing" hidden>
  <div class="quilt" id="quilt" aria-hidden="true"></div>
  <div class="door-card">
    <h1>Scratch Portfolio <span>Bedroom</span></h1>
    <p class="tag">Type any Scratch username.<br>Walk into a room built from their projects.</p>
    <form id="door-form" autocomplete="off">
      <label for="username" class="sr">Scratch username</label>
      <input id="username" name="username" placeholder="username" maxlength="40" spellcheck="false" autocapitalize="off" required>
      <button type="submit">Open the door</button>
    </form>
    <p id="door-error" role="alert"></p>
    <div class="or" aria-hidden="true"><span>or skip the wait</span></div>
    <button type="button" class="instant" data-try="jay"><b>Visit jay's room</b><small>Ready right now. One of the very first Scratchers.</small></button>
  </div>
  <footer>Fan-made, not affiliated with Scratch or MIT. Shows public data only. Projects belong to their creators.</footer>
</main>

<div id="loader">
  <div class="loader-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <p id="loader-text" role="status">Opening the door…</p>
</div>

<div id="hud" hidden></div>
<div id="card" hidden></div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="fade" aria-hidden="true"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
